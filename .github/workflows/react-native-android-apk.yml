# Build the Victor **React Native (2D) + Godot (3D)** demo as installable
# Android APKs and commit them to the repository root as
# `elpian-react-native-demo-<abi>.apk` (one per CPU architecture).
#
# The build is split per ABI (see `plugins/withAbiSplits.js`) because a single
# universal APK bundles native libs for every architecture and weighs ~118 MB,
# over GitHub's 100 MB per-file limit. Each per-ABI APK stays well under it.
#
# The app is the Expo host in `victor/react-native/` running the rich showcase
# guest (`assets/guest/showcase.js`): a React Native widget tree whose 2D
# controls drive an embedded Godot `Scene3D`, all on the Elpian VM.
#
# Pipeline: install deps -> `expo prebuild` (Continuous Native Generation emits
# the android/ Gradle project from app.json) -> `gradlew assembleRelease` ->
# copy to the repo root and commit it back to the triggering branch ([skip ci]
# guards the loop).
#
# WHY RELEASE (not debug): a debug APK keeps React Native's dev support on and
# loads `index.android.bundle` from a running Metro server over the network, so
# a sideloaded debug APK shows the red "Unable to load script" screen with no
# Metro reachable. The release variant embeds the JS bundle (Hermes bytecode)
# and turns dev support off, so it runs standalone. The generated project signs
# `release` with `signingConfigs.debug` (the auto-generated debug keystore), so
# the APK still installs without managing any signing secret.
#
# NOTE ON ON-DEVICE RUNTIME: React Native's Hermes engine has no WebAssembly, so
# this APK boots the RN shell but shows the graceful "VM backend not installed"
# screen until the native JSI `VmBackend` + native Godot view seams
# (documented in the package README) are filled in. Expo **web** already runs
# the real VM `.wasm`. This workflow exists to produce the installable native
# shell and keep it building.

name: React Native Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "victor/react-native/**"
      - "victor/bridge/prelude/reactnative.js"
      - ".github/workflows/react-native-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rn-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: victor/react-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Host sanity — pure TS + coverage + patching suites
        run: |
          node --experimental-strip-types test/host.test.ts
          node --experimental-strip-types test/style.test.ts
          node --experimental-strip-types test/components.test.ts
          node --experimental-strip-types test/patching.test.ts
          node --experimental-strip-types test/nativeBackend.test.ts
          node --experimental-strip-types test/godotEngine.test.ts

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prebuild the native Android project (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk + Android NDK
        run: |
          cargo install cargo-ndk --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cross-compile the Elpian VM (libelpian_rn.so, per ABI)
        working-directory: victor/react-native/native/elpian-rn
        # Build the same Rust VM the wasm path uses, as a native Android shared
        # library the JSI module (modules/elpian-rn) links + loads. Stage all
        # cargo-ndk output, then copy ONLY libelpian_rn.so into the module's
        # jniLibs (its CMake imports it and Gradle packages it into the APK).
        run: |
          STAGE="$RUNNER_TEMP/elpian-jnilibs"
          JNILIBS="$GITHUB_WORKSPACE/victor/react-native/modules/elpian-rn/android/src/main/jniLibs"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o "$STAGE" build --release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p "$JNILIBS/$abi"
            cp "$STAGE/$abi/libelpian_rn.so" "$JNILIBS/$abi/libelpian_rn.so"
          done
          find "$JNILIBS" -name 'libelpian_rn.so' -exec ls -la {} \;

      - name: Build the release APKs (one per ABI)
        working-directory: victor/react-native/android
        # Release embeds the JS bundle and disables dev support, so the APK runs
        # without Metro; it is signed with the debug keystore so it still
        # installs secret-free. The withAbiSplits config plugin enables Gradle's
        # per-ABI split, so one architecture-specific APK is emitted per ABI
        # instead of a single ~118 MB universal APK over GitHub's 100 MB limit.
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-rn"
          shopt -s nullglob
          found=0
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "$GITHUB_WORKSPACE/build-rn/elpian-react-native-demo-${abi}.apk"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "No per-ABI release APKs found — did the ABI split or signing get disabled?" >&2
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/build-rn"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elpian-react-native-demo-apks
          path: build-rn/elpian-react-native-demo-*.apk

      - name: Commit APK to repository root
        working-directory: ${{ github.workspace }}
        run: |
          # Drop everything the prebuild/gradle build generated (android/, any
          # touched lockfiles) so the tree is clean before committing just the
          # APK — `git pull --rebase` refuses to run on a dirty tree.
          git checkout -- . || true
          git clean -fdq victor/react-native/android victor/react-native/node_modules || true
          cp build-rn/elpian-react-native-demo-*.apk ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elpian-react-native-demo-*.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "ci: update React Native demo APKs [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
